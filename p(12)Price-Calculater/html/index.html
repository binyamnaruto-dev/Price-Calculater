<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Calculator</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>  
<!-- price calculater based on actual price ,task , discount -->
<!-- Head part -->
    <div class="Head">
        <div class="Head-Left">
            <p>Price Calculater | based on Tax-system and Discount.</p>
        </div>
        <div class="Head-Right">
            <img src="../asset/img/gettyimages-2177702127-612x612-removebg-preview.png" alt="">
        </div>
    </div>
<!-- body part of the price calculater -->
    <div class="Body-contaner">
    <!-- User inputs -->
            <div class="User-Input">
                <input class="Display-Result" type="text" title="Answer" placeholder="Result" disabled>
                <input class="User-Input-Price" type="number" title="Enter Amount" placeholder="Enter Amount.">
                <div class="Info-Div">
                    <!-- info tax and discount -->
                    <div class="info-td">
                        <p>Tax:15%</p>
                        <p>Discount:20%.</p>
                    </div>
                    <!-- button part -->
                    <div class="button-div">
                        <button class="btn">Calculate</button>
                        <button class="rbtn">Reset</button>
                    </div>
                </div>
            </div>
    </div>

    <!-- Footer part -->

    <div class="Footer-div">
        <p>Price and Tax Calculater | From:Binyam Naruto</p>
    </div>
<script src="../js/script.js"></script>
</body>
</html>
